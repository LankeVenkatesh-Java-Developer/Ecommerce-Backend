spring.application.name=user-management-service

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/user_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:Venky}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Venky@314}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always

# JWT Configuration
app.jwt.secret=mySecretKeyForJWTTokenGenerationWhichShouldBeLongEnoughForHS512Algorithm
app.jwt.expiration-in-ms=86400000

# Server Configuration
server.port=8081
server.servlet.context-path=/api/v1

# Logging
logging.level.com.venkatesh.it.usermanagementservice=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
