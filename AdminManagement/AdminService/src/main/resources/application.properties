spring.application.name=AdminService

# Disable Spring Cloud compatibility verifier for preview
spring.cloud.compatibility-verifier.enabled=false

# Disable Eureka client for standalone testing
spring.cloud.discovery.enabled=false
eureka.client.enabled=false

# H2 Database Configuration for Preview
spring.r2dbc.url=r2dbc:h2:mem:///adminservice
spring.r2dbc.driver=org.h2.Driver
spring.r2dbc.username=sa
spring.r2dbc.password=

# Server Port
server.port=8081

# Enable H2 Console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


