spring.application.name=admin-management-service

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/admin_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:Venky}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Venky@314}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Must match User Management Service)
app.jwt.secret=${APP_JWT_SECRET:mySecretKeyForJWTTokenGenerationWhichShouldBeLongEnoughForHS512Algorithm}
app.jwt.expiration-in-ms=86400000

# User Service Configuration
user.service.base-url=${USER_SERVICE_URL:http://localhost:8081/api/v1/users}
user.service.enabled=true

# Products Service Configuration
products.service.base-url=${PRODUCTS_SERVICE_URL:http://localhost:8082}

# Server Configuration
server.port=8083
server.servlet.context-path=/api/admin

# Logging
logging.level.com.venkatesh.it.adminmanagementservice=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

