services:
  - type: web
    name: userservice
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: "-Xmx512m -Xms256m"
      - key: DATABASE_URL
        fromDatabase:
          name: userservice-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: userservice-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: userservice-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: 6379

databases:
  - name: userservice-db
    databaseName: userservice
    user: userservice
    plan: free
    region: oregon
