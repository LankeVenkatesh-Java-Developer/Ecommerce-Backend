spring.application.name=UserService

# Server Configuration
server.port=${PORT}
server.forward-headers-strategy=framework

# R2DBC Database Configuration (Reactive) - Using Render PostgreSQL
spring.r2dbc.url=${DATABASE_URL:r2dbc:postgresql://dpg-da5gb83bc2fs738vjeqg-a:5432/postgresql_90ns}
spring.r2dbc.username=${DB_USERNAME:postgresql_90ns_user}
spring.r2dbc.password=${DB_PASSWORD:QI5wO8ZD2kIhXW1vAsE8P8Ak463oqKHx}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=2
spring.r2dbc.pool.max-size=10
spring.r2dbc.pool.max-idle-time=30m

# Redis Configuration (Caching) - Disabled for standalone deployment
# spring.data.redis.host=${REDIS_HOST:localhost}
# spring.data.redis.port=${REDIS_PORT:6379}
# spring.data.redis.password=${REDIS_PASSWORD:}
# spring.data.redis.timeout=2000ms
# spring.cache.type=redis
