spring:
  application:
    name: cart-management-service
  
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: testSecretKeyForJWTTokenGenerationWhichShouldBeLongEnoughForHS512Algorithm
    expiration-in-ms: 86400000

products:
  service:
    base-url: http://localhost:8082

server:
  port: 0

logging:
  level:
    com.venkatesh.it.cartmanagementservice: DEBUG
    org.hibernate.SQL: DEBUG

eureka:
  client:
    enabled: false

resilience4j:
  circuitbreaker:
    enabled: false
