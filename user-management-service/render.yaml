services:
  - type: web
    name: user-management-service
    env: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/user-management-service-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: user-management-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: user-management-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: user-management-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_IN_MS
        value: 86400000

databases:
  - name: user-management-db
    databaseName: user_management_db
    user: user_management_user
    plan: free
