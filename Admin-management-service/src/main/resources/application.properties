spring.application.name=admin-management-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/admin_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=Venky
spring.datasource.password=Venky@314
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Must match User Management Service)
app.jwt.secret=mySecretKeyForJWTTokenGenerationWhichShouldBeLongEnoughForHS512Algorithm
app.jwt.expiration-in-ms=86400000

# User Service Configuration
user.service.base-url=http://localhost:8081/api/v1/users
user.service.enabled=true

# Products Service Configuration
products.service.base-url=http://localhost:8083

# Server Configuration
server.port=8082
server.servlet.context-path=/api/admin

# Logging
logging.level.com.venkatesh.it.adminmanagementservice=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

