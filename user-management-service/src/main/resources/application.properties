spring.application.name=user-management-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/user_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=Venky
spring.datasource.password=Venky@314
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=mySecretKeyForJWTTokenGenerationWhichShouldBeLongEnoughForHS512Algorithm
app.jwt.expiration-in-ms=86400000

# Server Configuration
server.port=8081
server.servlet.context-path=/api/v1

# Logging
logging.level.com.venkatesh.it.usermanagementservice=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
