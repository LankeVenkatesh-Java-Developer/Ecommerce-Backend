# Eureka Service Discovery Configuration - Disabled for standalone deployment
eureka.client.enabled=false
eureka.client.service-url.default-zone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.event-consumer-buffer-size=10

# Resilience4j Retry Configuration
resilience4j.retry.instances.userServiceRetry.max-attempts=3
resilience4j.retry.instances.userServiceRetry.wait-duration=1s
resilience4j.retry.instances.userServiceRetry.enable-exponential-backoff=true
resilience4j.retry.instances.userServiceRetry.exponential-backoff-multiplier=2

# Resilience4j Rate Limiter Configuration
resilience4j.ratelimiter.instances.userServiceRateLimiter.limit-for-period=100
resilience4j.ratelimiter.instances.userServiceRateLimiter.limit-refresh-period=1s
resilience4j.ratelimiter.instances.userServiceRateLimiter.timeout-duration=3s

# Distributed Tracing Configuration
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

# Actuator Endpoints for Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,retries,ratelimiters
management.endpoint.health.show-details=always

# JWT Configuration
jwt.secret=${JWT_SECRET:mySuperSecretKeyForEcommerceUserService2026Secure}
jwt.expiration=3600000

# Logging Configuration
logging.level.org.springframework.r2dbc=INFO
logging.level.io.r2dbc=INFO
logging.level.com.ashok.it.userservice=INFO
