spring:
  application:
    name: order-service
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  security:
    jwt:
      secret: testSecretKeyForJWTTokenGenerationWhichShouldBeLongEnoughForHS512Algorithm
      expiration: 86400000

razorpay:
  key:
    id: test_key_id
    secret: test_key_secret

products:
  service:
    url: http://localhost:8082

server:
  port: 0

logging:
  level:
    com.venkatesh.it.ordermanagementservice: DEBUG
    org.hibernate.SQL: DEBUG

eureka:
  client:
    enabled: false

resilience4j:
  circuitbreaker:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
