spring:
  application:
    name: user-management-service
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  sql:
    init:
      mode: never
  
  session:
    store-type: none

app:
  jwt:
    secret: testSecretKeyForJWTTokenGenerationWhichShouldBeLongEnoughForHS512Algorithm
    expiration-in-ms: 86400000

server:
  port: 0

logging:
  level:
    com.venkatesh.it.usermanagementservice: DEBUG
    org.hibernate.SQL: DEBUG

eureka:
  client:
    enabled: false

resilience4j:
  circuitbreaker:
    enabled: false
