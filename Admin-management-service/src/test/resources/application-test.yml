spring:
  application:
    name: admin-management-service
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: testSecretKeyForJWTTokenGenerationWhichShouldBeLongEnoughForHS512Algorithm
    expiration-in-ms: 86400000

user:
  service:
    base-url: http://localhost:8081/api/v1/users
    enabled: false

products:
  service:
    base-url: http://localhost:8082

order:
  service:
    base-url: http://localhost:8084

server:
  port: 0

logging:
  level:
    com.venkatesh.it.adminmanagementservice: DEBUG
    org.hibernate.SQL: DEBUG

eureka:
  client:
    enabled: false

resilience4j:
  circuitbreaker:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
